name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests benchmarks examples && ruff format --check src tests
      - name: Type check
        run: mypy src/fluorostats
      - name: Tests (100% line coverage required)
        run: pytest -q --cov=fluorostats --cov-report=term-missing --cov-fail-under=100
